services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qai
      POSTGRES_PASSWORD: qai
      POSTGRES_DB: qai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qai"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer
    ports: ["8080:8080"]
    depends_on: [db]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://qai:qai@db:5432/qai
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: llama3.1:8b
      EMBED_MODEL: nomic-embed-text
    ports: ["8000:8000"]
    volumes:
      - ./api/app:/srv/app
      - ./data:/data
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_started}

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  ollama:
  n8n_data: