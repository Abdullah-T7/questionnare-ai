services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qai
      POSTGRES_PASSWORD: qai
      POSTGRES_DB: qai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qai"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer
    ports: ["8080:8080"]
    depends_on: [db]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://qai:qai@db:5432/qai
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: llama3.1:8b
      EMBED_MODEL: nomic-embed-text
    ports: ["8000:8000"]
    volumes:
      - ./api/app:/srv/app
      - ./data:/data
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_started}

volumes:
  pgdata:
  ollama: